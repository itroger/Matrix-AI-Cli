[package]
name = "matrix-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "matrix-cli"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
